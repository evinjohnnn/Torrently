{{ define "title" }}{{ t $.Lang "toolsPage.title" }}{{ end }}
{{ define "description" }}
    <meta name="description" content="{{ t $.Lang "toolsPage.description" }}">
{{ end }}
{{ define "main" }}
<section class="min-h-screen pt-24 sm:pt-[120px] pb-20 px-3 sm:px-6">
  <div class="max-w-[1100px] mx-auto">
    <h1 class="text-[clamp(2rem,4vw,2.8rem)] font-extrabold tracking-tight leading-tight mb-4">{{ t $.Lang "toolsPage.heading" }}</h1>
    <p class="text-[1.15rem] text-w-sub leading-relaxed mb-12">{{ t $.Lang "toolsPage.lede" }}</p>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      {{ range tools }}
      <a href="{{ langPath $.Lang (printf "/%s" .Url) }}" data-async-target="main" class="block p-5 rounded-2xl border border-w-line hover:border-w-pink/40 transition-colors no-underline group">
        <div class="text-base font-semibold mb-1 group-hover:text-w-pinkL">{{ t $.Lang .Title }}</div>
        <div class="text-[0.9rem] text-w-sub leading-relaxed line-clamp-2">{{ t $.Lang .Benefit }}</div>
      </a>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
